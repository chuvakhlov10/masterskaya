name: Apply legacy exact dedup hotfix

on:
  push:
    branches:
      - hotfix/legacy-exact-dedup

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/legacy-exact-dedup
          fetch-depth: 0
      - name: Apply patch once
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'exactModernByFingerprint' src/sync-core.js; then
            python3 scripts/apply-legacy-exact-dedup.py
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sync-core.js tests/sync-core.test.mjs
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Prevent exact legacy records from returning"
            git push origin HEAD:hotfix/legacy-exact-dedup
          fi

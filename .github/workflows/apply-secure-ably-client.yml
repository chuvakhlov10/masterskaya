name: Apply secure Ably JWT client

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'security/ably-jwt-client'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/ably-jwt-client
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/apply-secure-ably-client.mjs
      - run: npm ci
      - run: npm run check
      - name: Remove one-time patch files
        run: rm scripts/apply-secure-ably-client.mjs .github/workflows/apply-secure-ably-client.yml
      - name: Commit generated client switch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Switch browser Ably client to Yandex JWT auth"
          git push origin HEAD:security/ably-jwt-client

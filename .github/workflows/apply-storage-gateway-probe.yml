name: Apply storage gateway probe

on:
  push:
    branches:
      - security/storage-gateway-probe

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/storage-gateway-probe
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/apply-storage-gateway-probe.mjs
      - run: npm ci
      - run: npm run check
      - name: Remove one-time patch files
        run: rm scripts/apply-storage-gateway-probe.mjs .github/workflows/apply-storage-gateway-probe.yml
      - name: Commit generated probe installation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Wire storage gateway probe into the app"
          git push origin HEAD:security/storage-gateway-probe

name: Apply atomic record stock fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.head_ref == 'feature/atomic-record-stock'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/atomic-record-stock
          fetch-depth: 0

      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply patch
        run: python3 scripts/apply-atomic-record-stock.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and production build
        run: npm run check

      - name: Commit and push feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A src/App.jsx src/sync-core.js tests/sync-core.test.mjs
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Make record and stock mutations idempotent"
          fi
          git push origin HEAD:feature/atomic-record-stock

name: Apply record identifier fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.head_ref == 'fix/record-identifiers'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/record-identifiers
          fetch-depth: 0

      - name: Apply record ID fix
        run: python3 scripts/apply-record-id-fix.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests and production build
        run: npm run check

      - name: Commit and push fix branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A src/App.jsx src/sync-core.js tests/sync-core.test.mjs .record-id-fix-trigger
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Fix editing and deleting legacy records"
          fi
          git push origin HEAD:fix/record-identifiers

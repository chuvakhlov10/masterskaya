name: Apply stock realtime hotfix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.head_ref == 'hotfix/realtime-stock-refresh'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/realtime-stock-refresh
          fetch-depth: 0

      - name: Merge current main into hotfix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply hotfix
        run: python3 scripts/apply-stock-realtime-hotfix.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests and production build
        run: npm run check

      - name: Commit and push hotfix branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A src/App.jsx tests/sync-core.test.mjs .hotfix-trigger
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Fix realtime stock refresh on open devices"
          fi
          git push origin HEAD:hotfix/realtime-stock-refresh

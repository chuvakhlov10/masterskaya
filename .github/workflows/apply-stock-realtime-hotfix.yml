name: Apply stock realtime hotfix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.head_ref == 'hotfix/realtime-stock-refresh'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/realtime-stock-refresh
          fetch-depth: 0

      - name: Apply targeted realtime stock refresh hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          app_path = Path('src/App.jsx')
          test_path = Path('tests/sync-core.test.mjs')
          app = app_path.read_text(encoding='utf-8')
          marker = 'REALTIME_STOCK_REFRESH_HOTFIX_V1'

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          if marker not in app:
              app = replace_once(
                  app,
                  '  const isPollingRef = useRef(false);\n  const pollAgainRef = useRef(false);',
                  '  const isPollingRef = useRef(false);\n  const pollAgainRef = useRef(false);\n  const isStockRefreshingRef = useRef(false);\n  const stockRefreshAgainRef = useRef(false);',
                  'stock refresh refs',
              )
              app = replace_once(
                  app,
                  '    const base = Math.min(10_000 * (2 ** Math.max(0, attempt - 1)), 300_000);\n    const delay = base + Math.random() * Math.min(base * 0.3, 15_000);',
                  '    const base = Math.min(2_500 * (2 ** Math.max(0, attempt - 1)), 60_000);\n    const delay = base + Math.random() * Math.min(base * 0.25, 5_000);',
                  'stock retry delay',
              )
              app = replace_once(app, '    scheduleStockSync(2_000);', '    scheduleStockSync(700);', 'stock debounce')
              app = replace_once(
                  app,
                  '    const throttleLeft = 3_000 - (now - lastSyncAttemptRef.current);',
                  '    const throttleLeft = 1_200 - (now - lastSyncAttemptRef.current);',
                  'stock throttle',
              )

              helper = textwrap.dedent('''

                // REALTIME_STOCK_REFRESH_HOTFIX_V1
                // Быстрое обновление склада читает только stock-ops.json. Ошибка любого
                // другого файла приложения больше не блокирует получение нового остатка.
                function applyServerStockOps(serverOps) {
                  const outbox = getStockOutbox();
                  const normalizedServerOps = Array.isArray(serverOps) ? serverOps : [];
                  const mergedOps = mergeStockOps(normalizedServerOps, outbox);
                  stockOpsRef.current = mergedOps;
                  persistStockSnapshot(mergedOps);
                  const mergedStock = applyOpsToStock(mergedOps);
                  stockRef.current = mergedStock;
                  setStockOps(mergedOps);
                  setStock(mergedStock);

                  const serverIds = new Set(normalizedServerOps.map(op => op?.opId).filter(Boolean));
                  const confirmed = new Set(outbox.filter(op => serverIds.has(op.opId)).map(op => op.opId));
                  const remainingOutbox = removeStockOutboxIds(confirmed);
                  unsyncedOpsRef.current = new Set(remainingOutbox.map(op => op.opId).filter(Boolean));
                  setPendingCount(getQueue().length + remainingOutbox.length);
                  if (remainingOutbox.length > 0) scheduleStockSync(250, false);
                  return mergedOps;
                }

                async function refreshStockFromServer() {
                  if (!navigator.onLine) return { ok: false, offline: true };
                  if (isStockRefreshingRef.current) {
                    stockRefreshAgainRef.current = true;
                    return { ok: false, busy: true };
                  }

                  isStockRefreshingRef.current = true;
                  try {
                    const serverOps = await sGet("stock-ops", { allowCache: false });
                    if (!Array.isArray(serverOps)) throw new Error("INVALID_STOCK_OPS_RESPONSE");
                    const mergedOps = applyServerStockOps(serverOps);
                    setSyncStatus(wsConnectedRef.current ? "ws" : "synced");
                    return { ok: true, value: mergedOps };
                  } catch (error) {
                    console.warn('[STOCK REFRESH] Ошибка:', error.message);
                    return { ok: false, error: error.message };
                  } finally {
                    isStockRefreshingRef.current = false;
                    if (stockRefreshAgainRef.current) {
                      stockRefreshAgainRef.current = false;
                      setTimeout(() => refreshStockFromServer(), 150);
                    }
                  }
                }
              ''')
              app, count = re.subn(
                  r'(  syncStockOpsRef\.current = syncStockOps;\n)',
                  r'\1' + helper,
                  app,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'stock refresh helper insertion: expected one match, found {count}')

              stock_block_pattern = re.compile(
                  r'''        if \(Array\.isArray\(ops\)\) \{\n'''
                  r'''          const outbox = getStockOutbox\(\);\n'''
                  r'''          const mergedOps = mergeStockOps\(ops, outbox\);\n'''
                  r'''          stockOpsRef\.current = mergedOps;\n'''
                  r'''          persistStockSnapshot\(mergedOps\);\n'''
                  r'''          const mergedStock = applyOpsToStock\(mergedOps\);\n'''
                  r'''          stockRef\.current = mergedStock;\n'''
                  r'''          setStockOps\(mergedOps\);\n'''
                  r'''          setStock\(mergedStock\);\n'''
                  r'''          const serverIds = new Set\(ops\.map\(op => op\?\.opId\)\.filter\(Boolean\)\);\n'''
                  r'''          const confirmed = new Set\(outbox\.filter\(op => serverIds\.has\(op\.opId\)\)\.map\(op => op\.opId\)\);\n'''
                  r'''          const remainingOutbox = removeStockOutboxIds\(confirmed\);\n'''
                  r'''          unsyncedOpsRef\.current = new Set\(remainingOutbox\.map\(op => op\.opId\)\.filter\(Boolean\)\);\n'''
                  r'''          if \(remainingOutbox\.length > 0\) scheduleStockSync\(250, false\);\n'''
                  r'''        \}'''
              )
              app, count = stock_block_pattern.subn('        if (Array.isArray(ops)) applyServerStockOps(ops);', app, count=1)
              if count != 1:
                  raise SystemExit(f'full poll stock block: expected one match, found {count}')

              old_ably = '''    let ablyPollTimer = null;
    const requestServerRefresh = () => {
      if (ablyPollTimer) clearTimeout(ablyPollTimer);
      ablyPollTimer = setTimeout(() => {
        ablyPollTimer = null;
        doPollRef.current?.();
      }, 600);
    };
    channel.subscribe((msg) => {
      if (msg.data?.from === clientIdRef.current) return;
      console.log('[ABLY] Server refresh signal:', msg.name, msg.data?.key || '');
      requestServerRefresh();
    });'''
              new_ably = '''    let ablyPollTimer = null;
    let ablyStockTimer = null;
    const requestServerRefresh = () => {
      if (ablyPollTimer) clearTimeout(ablyPollTimer);
      ablyPollTimer = setTimeout(() => {
        ablyPollTimer = null;
        doPollRef.current?.();
      }, 400);
    };
    const requestStockRefresh = () => {
      if (ablyStockTimer) clearTimeout(ablyStockTimer);
      ablyStockTimer = setTimeout(() => {
        ablyStockTimer = null;
        refreshStockFromServer();
      }, 150);
    };
    channel.subscribe((msg) => {
      if (msg.data?.from === clientIdRef.current) return;
      const changedKey = msg.data?.key || '';
      console.log('[ABLY] Server refresh signal:', msg.name, changedKey);
      if (changedKey === "stock-ops") requestStockRefresh();
      else requestServerRefresh();
    });'''
              app = replace_once(app, old_ably, new_ably, 'Ably targeted refresh')

              app = replace_once(
                  app,
                  '''    ably.connection.on('connected', () => {
      console.log('[ABLY] Подключено');
      wsConnectedRef.current = true;
      if (navigator.onLine) setSyncStatus("ws");
    });''',
                  '''    ably.connection.on('connected', () => {
      console.log('[ABLY] Подключено');
      wsConnectedRef.current = true;
      if (navigator.onLine) {
        setSyncStatus("ws");
        setTimeout(() => refreshStockFromServer(), 100);
      }
    });''',
                  'Ably connected refresh',
              )
              app = replace_once(
                  app,
                  '''    if (ably.connection.state === 'connected') {
      wsConnectedRef.current = true;
      setSyncStatus("ws");
    }''',
                  '''    if (ably.connection.state === 'connected') {
      wsConnectedRef.current = true;
      setSyncStatus("ws");
      setTimeout(() => refreshStockFromServer(), 100);
    }''',
                  'already connected refresh',
              )
              app = replace_once(
                  app,
                  '''    window.addEventListener('online', handleOnline);
    window.addEventListener('offline', handleOffline);''',
                  '''    const handleFocus = () => {
      if (navigator.onLine) refreshStockFromServer();
    };
    const handleVisibilityChange = () => {
      if (document.visibilityState === 'visible' && navigator.onLine) refreshStockFromServer();
    };
    window.addEventListener('online', handleOnline);
    window.addEventListener('offline', handleOffline);
    window.addEventListener('focus', handleFocus);
    document.addEventListener('visibilitychange', handleVisibilityChange);''',
                  'focus visibility listeners',
              )
              app = replace_once(
                  app,
                  '''    const initialTimer = setTimeout(poll, 3000);
    const interval = setInterval(poll, 60000); // polling каждые 60 сек (Ably для мгновенной)''',
                  '''    const initialStockTimer = setTimeout(() => refreshStockFromServer(), 500);
    const initialTimer = setTimeout(poll, 3000);
    const stockInterval = setInterval(() => refreshStockFromServer(), 15000);
    const interval = setInterval(poll, 60000); // полный polling раз в 60 сек''',
                  'stock polling interval',
              )
              app = replace_once(
                  app,
                  '''      clearTimeout(initialTimer);
      clearInterval(interval);
      clearInterval(onlineCheckInterval);
      if (ablyPollTimer) clearTimeout(ablyPollTimer);''',
                  '''      clearTimeout(initialStockTimer);
      clearTimeout(initialTimer);
      clearInterval(stockInterval);
      clearInterval(interval);
      clearInterval(onlineCheckInterval);
      if (ablyPollTimer) clearTimeout(ablyPollTimer);
      if (ablyStockTimer) clearTimeout(ablyStockTimer);''',
                  'timer cleanup',
              )
              app = replace_once(
                  app,
                  '''      window.removeEventListener('online', handleOnline);
      window.removeEventListener('offline', handleOffline);''',
                  '''      window.removeEventListener('online', handleOnline);
      window.removeEventListener('offline', handleOffline);
      window.removeEventListener('focus', handleFocus);
      document.removeEventListener('visibilitychange', handleVisibilityChange);''',
                  'listener cleanup',
              )
              app_path.write_text(app, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          test_name = 'two consecutive set operations keep the final zero value'
          if test_name not in tests:
              tests += '''\n\ntest('two consecutive set operations keep the final zero value', () => {\n  const stock = applyOpsToStock([\n    op({ type: 'set', opId: 'set-three', marker: 'TEST', location: 'main', value: 3, delta: undefined, ts: 1_800_000_000_010 }),\n    op({ type: 'set', opId: 'set-zero', marker: 'TEST', location: 'main', value: 0, delta: undefined, ts: 1_800_000_000_020 }),\n  ]);\n  assert.equal(stock.main.TEST, 0);\n});\n'''
              test_path.write_text(tests, encoding='utf-8')

          Path('.hotfix-trigger').unlink(missing_ok=True)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests and production build
        run: npm run check

      - name: Commit hotfix to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A src/App.jsx tests/sync-core.test.mjs .hotfix-trigger
          if git diff --cached --quiet; then
            echo "Hotfix already applied"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix realtime stock refresh on open devices"
          git push origin HEAD:hotfix/realtime-stock-refresh

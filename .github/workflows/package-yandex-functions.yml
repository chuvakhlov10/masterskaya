name: Package Yandex functions

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set reproducible build metadata
        run: |
          echo "MASTERSKAYA_BUILD_ID=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          echo "MASTERSKAYA_BUILD_DATE=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      - name: Build and verify single-file functions
        run: |
          npm run build:functions
          npm run verify:functions
      - name: Create deployment archives
        run: |
          set -euo pipefail
          mkdir -p dist/yandex/packages
          (cd dist/yandex/storage && zip -9 ../packages/masterskaya-storage-gateway-1.4.1.zip index.js)
          (cd dist/yandex/ably && zip -9 ../packages/masterskaya-ably-auth-1.4.1.zip index.js)
          cp dist/yandex/manifest.json dist/yandex/packages/manifest.json
          (cd dist/yandex/packages && sha256sum *.zip > SHA256SUMS.txt)
          test "$(unzip -Z1 dist/yandex/packages/masterskaya-storage-gateway-1.4.1.zip | wc -l)" -eq 1
          test "$(unzip -Z1 dist/yandex/packages/masterskaya-storage-gateway-1.4.1.zip)" = "index.js"
          test "$(unzip -Z1 dist/yandex/packages/masterskaya-ably-auth-1.4.1.zip | wc -l)" -eq 1
          test "$(unzip -Z1 dist/yandex/packages/masterskaya-ably-auth-1.4.1.zip)" = "index.js"
          cat dist/yandex/packages/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yandex-functions-1.4.1
          path: dist/yandex/packages/*
          if-no-files-found: error
          retention-days: 30

name: Apply data status screen

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-test-push:
    if: github.head_ref == 'feature/data-status-screen'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/data-status-screen
          fetch-depth: 0

      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply status screen patch once
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'backupStatusGet' src/github-storage.js; then
            python3 scripts/apply-data-status-screen.py
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and production build
        run: npm run check

      - name: Commit and push feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A src/App.jsx src/github-storage.js src/status-core.js tests/status-core.test.mjs tests/github-storage.test.mjs
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "Add data status screen and manual sync controls"
          fi
          git push origin HEAD:feature/data-status-screen

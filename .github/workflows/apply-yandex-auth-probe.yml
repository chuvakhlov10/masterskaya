name: Apply Yandex auth probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/apply-yandex-auth-probe.mjs
      - run: npm ci
      - run: npm run check
      - name: Remove one-time patch files
        run: rm scripts/apply-yandex-auth-probe.mjs .github/workflows/apply-yandex-auth-probe.yml
      - name: Commit generated App change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Wire Yandex Ably auth probe into the app"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
